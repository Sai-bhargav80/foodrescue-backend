services:
  - type: web
    name: foodrescue-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: foodrescue-redis
          property: connectionString

  - type: redis
    name: foodrescue-redis
    region: oregon
    plan: free
    ipAllowList: []
